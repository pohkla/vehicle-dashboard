<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vehicle Insurance Dashboard v15</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"><\/script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"><\/script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"><\/script>
<style>
/* v15.0 Premium Fintech UI - Complete Redesign */
:root {
  --font: "IBM Plex Sans Thai", system-ui, sans-serif;
  --bg: #f4f5fa;
  --surface: #ffffff;
  --surface2: #f8f9fc;
  --border: rgba(30,40,80,.09);
  --border2: rgba(30,40,80,.05);
  --text: #111827;
  --text2: #4b5563;
  --muted: #9ca3af;
  --ink: #1d2b55;
  --blue: #4f46e5;
  --blue2: #6366f1;
  --teal: #0d9488;
  --teal2: #14b8a6;
  --amber: #d97706;
  --rose: #e11d48;
  --emerald: #059669;
  --grad-hero: linear-gradient(135deg,#1e1b4b 0%,#312e81 40%,#1d4ed8 76%,#0891b2 100%);
  --grad-blue: linear-gradient(135deg,#4f46e5,#6366f1);
  --shadow-xs: 0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-sm: 0 4px 12px rgba(0,0,0,.06),0 1px 4px rgba(0,0,0,.04);
  --shadow-md: 0 8px 24px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.04);
  --shadow-lg: 0 20px 48px rgba(0,0,0,.10),0 4px 16px rgba(0,0,0,.05);
  --shadow-xl: 0 32px 72px rgba(0,0,0,.14),0 8px 24px rgba(0,0,0,.06);
  --radius: 18px;
  --radius-lg: 24px;
  --radius-xl: 32px;
}
body.dark {
  --bg: #0b0f1e;
  --surface: #111827;
  --surface2: #161e2e;
  --border: rgba(148,163,184,.10);
  --border2: rgba(148,163,184,.05);
  --text: #f1f5f9;
  --text2: #94a3b8;
  --muted: #64748b;
  --ink: #e2e8f0;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);
  background:radial-gradient(ellipse at 0% 0%,rgba(79,70,229,.07) 0%,transparent 50%),
             radial-gradient(ellipse at 100% 100%,rgba(13,148,136,.05) 0%,transparent 50%),
             var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  transition:background .35s,color .25s;
}
body.dark{
  background:radial-gradient(ellipse at 0% 0%,rgba(79,70,229,.18) 0%,transparent 50%),
             radial-gradient(ellipse at 100% 100%,rgba(13,148,136,.12) 0%,transparent 50%),
             var(--bg) !important;
}
a{text-decoration:none;color:inherit}

/* Page wrapper */
.page{width:min(1360px,96vw);margin:0 auto;padding:0 0 64px}

/* Loading */
.loading-overlay{position:fixed;inset:0;background:rgba(11,15,30,.6);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:9999}
.loading-overlay.show{display:flex}
.loading-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px 32px;box-shadow:var(--shadow-xl);display:flex;gap:14px;align-items:center;font-weight:600;color:var(--text)}
.spinner{width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOP NAV */
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(244,245,250,.88);
  backdrop-filter:blur(18px) saturate(1.6);
  -webkit-backdrop-filter:blur(18px) saturate(1.6);
  border-bottom:1px solid var(--border);
}
body.dark .topbar{background:rgba(11,15,30,.86)}
.topbar-inner{
  width:min(1360px,96vw);
  margin:0 auto;
  display:flex;align-items:center;gap:10px;
  padding:10px 0;
  flex-wrap:wrap;
}
.topbar-brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;color:var(--ink);flex-shrink:0}
.brand-icon{width:34px;height:34px;background:var(--grad-blue);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 4px 12px rgba(79,70,229,.35)}
.topbar-sep{flex:1}
.topbar-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}

/* Range pill */
.range-pill{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--border);border-radius:999px;
  padding:7px 14px 7px 10px;
  font-size:13px;font-weight:600;cursor:pointer;
  box-shadow:var(--shadow-xs);
  transition:box-shadow .2s,border-color .2s,transform .2s;
  white-space:nowrap;
}
.range-pill:hover{border-color:rgba(79,70,229,.4);box-shadow:0 0 0 4px rgba(79,70,229,.08),var(--shadow-sm);transform:translateY(-1px)}
.cal-icon{width:26px;height:26px;background:rgba(79,70,229,.1);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
#rangePicker{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
#startDate,#endDate{display:none}

/* Quick filter group */
.qfilter-group{display:flex;gap:3px;background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:4px}
.qbtn{border:none;background:transparent;border-radius:999px;padding:5px 12px;font-family:var(--font);font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .18s;white-space:nowrap}
.qbtn:hover{color:var(--text);background:var(--surface)}
.qbtn.active{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.28)}
.qbtn.muted{color:var(--muted)}

/* Topbar buttons */
.tb-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 14px;font-family:var(--font);font-size:12px;font-weight:700;color:var(--text2);cursor:pointer;transition:all .18s;white-space:nowrap;text-decoration:none}
.tb-btn:hover{border-color:rgba(79,70,229,.35);color:var(--blue);background:rgba(79,70,229,.04)}
.tb-btn.primary{background:var(--grad-blue);border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.28)}
.tb-btn.primary:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(79,70,229,.35)}

/* HERO */
.hero-wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin:20px 0 16px}

/* Vehicle card */
.vcard{background:var(--grad-hero);border-radius:var(--radius-xl);padding:28px;color:#fff;position:relative;overflow:hidden;box-shadow:0 24px 60px rgba(30,27,75,.28)}
.vcard::before{content:"";position:absolute;width:380px;height:380px;border-radius:50%;top:-140px;right:-100px;background:radial-gradient(circle,rgba(255,255,255,.10) 0%,transparent 70%);pointer-events:none}
.vcard::after{content:"";position:absolute;width:200px;height:200px;border-radius:50%;bottom:-60px;left:20px;background:radial-gradient(circle,rgba(20,184,166,.18) 0%,transparent 70%);pointer-events:none}
.vcard>*{position:relative;z-index:1}
.vcard-tag{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;margin-bottom:14px}
.vcard h2{font-size:22px;font-weight:700;margin-bottom:4px}
.vcard .sub{font-size:13px;opacity:.75;margin-bottom:16px}
.vcard-total{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.vcard-total .num{font-size:52px;font-weight:700;letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums}
.vcard-total .unit{font-size:16px;opacity:.7}
.live-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;margin-bottom:16px}
.live-dot{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 4px rgba(74,222,128,.22);animation:pulse 2s ease infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(74,222,128,.22)}50%{box-shadow:0 0 0 8px rgba(74,222,128,.08)}}
.breakdown-list{display:grid;gap:9px}
.breakdown-row{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;padding:10px 12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:var(--radius);transition:background .18s}
.breakdown-row:hover{background:rgba(255,255,255,.16)}
.break-icon{font-size:16px}
.break-label{font-size:13px;font-weight:600}
.break-right{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700}
.break-pct{opacity:.6;font-size:12px}
.bar-track{grid-column:1/-1;height:4px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:-2px}
.bar-fill{height:100%;border-radius:99px;background:rgba(255,255,255,.7);transition:width .5s cubic-bezier(.4,0,.2,1)}
.bar-fill.teal{background:#2dd4bf}
.bar-fill.violet{background:#a78bfa}

/* Money card */
.money-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:24px;box-shadow:var(--shadow-md);display:flex;flex-direction:column;transition:box-shadow .22s}
.money-card:hover{box-shadow:var(--shadow-lg)}
.label-sm{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.amount{font-size:38px;font-weight:700;color:var(--blue);letter-spacing:-1.5px;line-height:1.1;font-variant-numeric:tabular-nums;margin-bottom:2px}
.amount.green{color:var(--emerald)}
.divider{height:1px;background:var(--border);margin:14px 0}

/* Summary table */
.stbl{width:100%;border-collapse:collapse;font-size:13px}
.stbl th{text-align:left;padding:8px 6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--border)}
.stbl td{padding:10px 6px;border-bottom:1px solid var(--border2);font-weight:500;color:var(--text2);vertical-align:middle}
.stbl td:last-child{text-align:right;font-weight:700}
.stbl .clickable-row{cursor:pointer;transition:background .15s}
.stbl .clickable-row:hover{background:rgba(79,70,229,.03)}
.row-title{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--text)}
.breakdown-toggle-btn{display:inline-flex;align-items:center;gap:5px;background:rgba(79,70,229,.07);border:1px solid rgba(79,70,229,.14);border-radius:999px;padding:3px 9px;font-size:10px;font-weight:700;color:var(--blue);cursor:pointer;transition:all .18s;margin-left:8px}
.breakdown-toggle-btn:hover{background:rgba(79,70,229,.12);border-color:rgba(79,70,229,.25)}
.toggle-caret{font-size:11px;transition:transform .25s ease;display:inline-block}
.stbl .clickable-row.open .toggle-caret{transform:rotate(180deg)}
.summary-slide-row td{padding:0 6px !important;border-bottom:0 !important}
.summary-slide{max-height:0;overflow:hidden;opacity:0;transition:max-height .28s ease,opacity .22s ease,padding .22s ease}
.summary-slide.open{max-height:300px;opacity:1;padding:10px 0 12px}
.summary-subgrid{display:grid;gap:8px}
.summary-subitem{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px 12px;transition:all .18s}
.summary-subitem:hover{border-color:rgba(79,70,229,.2)}
.summary-subitem .sub-category-name{font-weight:600;font-size:12.5px;color:var(--text2)}
.summary-subitem b{font-weight:700;font-size:12.5px;text-align:right}
.summary-subitem .net{color:var(--blue)}
.summary-subitem .collected{color:var(--emerald)}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow-sm);transition:all .22s;animation:fadeUp .4s ease both;position:relative;overflow:hidden}
.kpi:nth-child(2){animation-delay:.05s}
.kpi:nth-child(3){animation-delay:.1s}
.kpi:nth-child(4){animation-delay:.15s}
.kpi:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.kpi.active{transform:translateY(-5px) scale(1.02);box-shadow:0 0 0 2px rgba(79,70,229,.2),var(--shadow-lg);border-color:rgba(79,70,229,.25)}
.kpi.dim{opacity:.5;transform:none}
.kpi-top{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--text2);margin-bottom:10px}
.company-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.kpi .value{font-size:32px;font-weight:700;color:var(--text);letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1;margin-bottom:2px}
.kpi .title{font-size:12px;color:var(--muted);font-weight:500}
.company-meta{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--muted);margin-top:10px}
.company-progress{height:5px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:6px;border:1px solid var(--border2)}
.company-progress span{display:block;height:100%;border-radius:99px;width:0%;transition:width .5s cubic-bezier(.4,0,.2,1)}
.company-detail{margin-top:12px;padding-top:10px;border-top:1px solid var(--border);display:grid;gap:5px;font-size:11.5px}
.company-detail .line{display:flex;justify-content:space-between;gap:8px;color:var(--text2)}
.company-detail b{color:var(--text);font-weight:700}

/* Daily toolbar */
.daily-toolbar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow-xs);display:grid;grid-template-columns:auto 1fr;gap:12px 16px;align-items:center}
.daily-toolbar h2{font-size:15px;font-weight:700;color:var(--text);white-space:nowrap}
.filter-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}

/* Form controls */
.search-input{flex:1;min-width:180px;border:1px solid var(--border);border-radius:12px;padding:8px 14px;font-family:var(--font);font-size:13px;background:var(--surface2);color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s}
.search-input:focus{border-color:rgba(79,70,229,.4);box-shadow:0 0 0 4px rgba(79,70,229,.08);background:var(--surface)}
.search-input::placeholder{color:var(--muted)}
.date-select{border:1px solid var(--border);border-radius:12px;padding:8px 12px;font-family:var(--font);font-size:13px;background:var(--surface2);color:var(--text);outline:none;cursor:pointer;transition:border-color .2s}
.date-select:focus{border-color:rgba(79,70,229,.4)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:12px;padding:7px 13px;font-family:var(--font);font-size:12px;font-weight:700;cursor:pointer;transition:all .18s;white-space:nowrap;background:var(--surface2);color:var(--text2)}
.btn:hover{border-color:rgba(79,70,229,.3);color:var(--blue);background:rgba(79,70,229,.04)}
.btn.active,.btn.btn-primary{background:var(--grad-blue);border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.25)}
.btn.btn-dark{background:var(--ink);border-color:transparent;color:#fff}
.btn.btn-dark:hover{opacity:.88}
body.dark .btn.btn-dark{background:rgba(255,255,255,.08);border-color:var(--border);color:var(--text2)}
body.dark .btn.btn-dark:hover{background:rgba(255,255,255,.14);color:#fff}

/* Daily grid */
.daily-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.daily-grid.compact{grid-template-columns:1fr;gap:8px}
.day-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-xs);transition:all .22s;animation:fadeUp .36s ease both;position:relative}
.day-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:rgba(79,70,229,.15)}
.day-card.peak::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--grad-blue);border-radius:4px 0 0 4px}
.day-card.high{border-color:rgba(79,70,229,.12)}
.day-card.low{opacity:.75}
.day-card.compact-card{border-radius:var(--radius)}
.day-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border:none;background:none;cursor:pointer;font-family:var(--font);text-align:left;transition:background .15s}
.day-head:hover{background:rgba(79,70,229,.03)}
.compact-card .day-head{padding:12px 14px}
.day-main{display:grid;gap:5px;flex:1}
.day-title{font-size:15px;font-weight:700;color:var(--text)}
.compact-card .day-title{font-size:14px}
.quick-summary{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;font-weight:700}
.mini-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);font-size:11.5px;color:var(--text2)}
.day-tags{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.badge{display:inline-flex;align-items:center;background:rgba(79,70,229,.08);color:var(--blue);border:1px solid rgba(79,70,229,.14);border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:700;white-space:nowrap}
.tag-peak{background:rgba(217,119,6,.09);color:var(--amber);border-color:rgba(217,119,6,.18)}
.tag-low{background:var(--surface2);color:var(--muted);border-color:var(--border)}
.tag-high{background:rgba(5,150,105,.08);color:var(--emerald);border-color:rgba(5,150,105,.18)}
.chev{font-size:16px;color:var(--muted);transition:transform .22s}
.day-card.open .chev{transform:rotate(180deg)}
.day-body{max-height:0;overflow:hidden;opacity:0;transition:max-height .32s ease,opacity .25s ease,padding .22s ease;border-top:1px solid transparent;padding:0 18px}
.day-card.open .day-body{max-height:1200px;opacity:1;padding:0 18px 18px;border-top-color:var(--border)}
.compact-card .day-body{padding:0 14px}
.compact-card.open .day-body{padding:0 14px 14px}
.day-money-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 8px}
.money-pill{border-radius:12px;padding:12px 14px;display:grid;gap:2px;border:1px solid var(--border)}
.money-pill.net{background:rgba(79,70,229,.05);border-color:rgba(79,70,229,.12)}
.money-pill.collected{background:rgba(5,150,105,.05);border-color:rgba(5,150,105,.12)}
.money-pill span,.money-pill small{font-size:11px;font-weight:700;color:var(--muted)}
.money-pill strong{font-size:18px;font-weight:700}
.money-pill.net strong{color:var(--blue)}
.money-pill.collected strong{color:var(--emerald)}
.vehicle-group{margin-top:12px}
.vehicle-title{font-weight:700;margin-bottom:6px;font-size:13px}
.vehicle-title-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.vehicle-money{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.money-chip{font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap;border:1px solid}
.money-chip.net{color:var(--blue);background:rgba(79,70,229,.07);border-color:rgba(79,70,229,.16)}
.money-chip.collected{color:var(--emerald);background:rgba(5,150,105,.07);border-color:rgba(5,150,105,.16)}
.company-tag{display:inline-flex;align-items:center;margin:4px 0;padding:2px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);font-size:11px;font-weight:700;color:var(--muted)}
ul{list-style:none;padding:0;margin:0;display:grid;gap:5px}
li{background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:8px 10px;font-size:12.5px;transition:all .16s}
li:hover{background:rgba(79,70,229,.04);border-color:rgba(79,70,229,.12);transform:translateX(2px)}
.vehicle-item-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.item-money{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.item-money span{font-size:11px;font-weight:700;border-radius:999px;padding:2px 7px;border:1px solid}
.item-money .net{color:var(--blue);background:rgba(79,70,229,.06);border-color:rgba(79,70,229,.14)}
.item-money .collected{color:var(--emerald);background:rgba(5,150,105,.06);border-color:rgba(5,150,105,.14)}

/* Pagination */
.pagination{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:16px 0 12px}
.page-info{color:var(--muted);font-size:12.5px;font-weight:600}

/* Status */

<script>

let report=null,allDays=[],filteredDays=[],viewDays=[],dailyChart=null,rangePickerInstance=null;let currentPage=1,pageSize=8,viewMode='detail',activeSelected='all';const box=id=>document.getElementById(id);const money=n=>Math.round(n||0).toLocaleString('th-TH');function destroy(){if(dailyChart)dailyChart.destroy()}function fmtDate(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}function parseISODate(v){const parts=String(v||'').split('-').map(Number);return parts.length===3?new Date(parts[0],parts[1]-1,parts[2]):new Date()}function prettyRange(s,e){if(!s&&!e)return 'ข้อมูลสะสมทั้งหมด';const opt={day:'2-digit',month:'short',year:'numeric'};const a=s?parseISODate(s).toLocaleDateString('en-GB',opt):'เริ่มต้น';const b=e?parseISODate(e).toLocaleDateString('en-GB',opt):'สิ้นสุด';return `${a} → ${b}`}function updateRangeLabel(){const s=box('startDate')?.value||'',e=box('endDate')?.value||'';if(box('rangeDisplayText'))box('rangeDisplayText').textContent=prettyRange(s,e);if(rangePickerInstance&&s&&e)rangePickerInstance.setDate([s,e],false,'Y-m-d')}function setActiveQuick(id){['todayBtn','thisWeekBtn','thisMonthBtn'].forEach(x=>box(x)?.classList.remove('active'));if(id)box(id)?.classList.add('active')}function setRange(start,end,quickId){box('startDate').value=start||'';box('endDate').value=end||'';setActiveQuick(quickId);updateRangeLabel()}function setCurrentMonthDefault(){const now=new Date();setRange(fmtDate(new Date(now.getFullYear(),now.getMonth(),1)),fmtDate(new Date(now.getFullYear(),now.getMonth()+1,0)),'thisMonthBtn')}function setToday(){const now=new Date();setRange(fmtDate(now),fmtDate(now),'todayBtn')}function setThisWeek(){const now=new Date();const day=now.getDay();const diffToMonday=(day===0?-6:1-day);const start=new Date(now);start.setDate(now.getDate()+diffToMonday);const end=new Date(start);end.setDate(start.getDate()+6);setRange(fmtDate(start),fmtDate(end),'thisWeekBtn')}function setupRange(){const dates=allDays.map(d=>d.isoDate).filter(Boolean).sort();if(!box('startDate').value)box('startDate').value=dates[0]||'';if(!box('endDate').value)box('endDate').value=dates[dates.length-1]||'';updateRangeLabel()}function itemText(item){return (item&&typeof item==='object')?(item.text||''):String(item||'')}function itemNet(item){return Number((item&&typeof item==='object')?(item.net_amount||0):0)||0}function itemCollected(item){return Number((item&&typeof item==='object')?(item.collected_amount||0):0)||0}function flattenRows(days){const rows=[];days.forEach(day=>day.groups.forEach(g=>g.items.forEach(item=>rows.push({date:day.date,type:g.title,company:g.company||'',item:itemText(item),net_amount:itemNet(item),collected_amount:itemCollected(item)}))));return rows}
function animateNumber(el,target){const end=Number(target)||0;const start=Number((el.textContent||'0').replace(/,/g,''))||0;const duration=420;const t0=performance.now();function tick(now){const p=Math.min(1,(now-t0)/duration);const eased=1-Math.pow(1-p,3);el.textContent=money(start+(end-start)*eased);if(p<1)requestAnimationFrame(tick);else el.textContent=money(end)}requestAnimationFrame(tick)}

function getCompanyData(){
 return filteredDays.map(day=>{
   let RVP=0, ERGO=0, TPB=0, UNKNOWN=0;
   (day.groups||[]).forEach(g=>{
     const company=(g.company||'').toLowerCase();
     const count=(g.items&&g.items.length)?g.items.length:(g.count||0);
     if(g.key==='motorcycle'){
       RVP += count;
     }else if(company.includes('ergo')){
       ERGO += count;
     }else if(company.includes('ไทยไพบูลย์') || company.includes('tpb')){
       TPB += count;
     }else{
       UNKNOWN += count;
     }
   });
   return {date:day.date,label:day.date.slice(0,5),RVP,ERGO,TPB,UNKNOWN,total:RVP+ERGO+TPB+UNKNOWN};
 });
}

 return companyData.reduce((acc,d)=>{acc.RVP+=d.RVP;acc.ERGO+=d.ERGO;acc.TPB+=d.TPB;acc.UNKNOWN+=(d.UNKNOWN||0);acc.total+=d.total;return acc;},{RVP:0,ERGO:0,TPB:0,UNKNOWN:0,total:0});
}
