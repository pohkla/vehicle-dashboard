services:
  - type: web
    name: vehicle-dashboard-system
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GITHUB_BRANCH
        value: main
      - key: GITHUB_DB_PATH
        value: data/vehicle-dashboard.json
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_TOKEN
        sync: false
